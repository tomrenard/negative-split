<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Perf test</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #e6e4df; }
      canvas { display: block; }
      #hud {
        position: fixed; top: 12px; left: 12px; right: 12px; color: #141414;
        font: 500 14px/1.3 Helvetica, sans-serif; white-space: pre; pointer-events: none;
        text-shadow: 0 0 4px #e6e4df;
      }
      #result {
        position: fixed; inset: 0; display: grid; place-items: center; padding: 16px;
        background: rgba(230, 228, 223, 0.94); font: 500 16px/1.4 Helvetica, sans-serif; color: #141414;
      }
      #result[hidden] { display: none; }
      #result pre { white-space: pre-wrap; max-width: 720px; margin: 0; }
      #result button { margin-top: 16px; font: 700 16px Helvetica, sans-serif; padding: 12px 20px; border: 0; background: #141414; color: #e6e4df; }
    </style>
  </head>
  <body>
    <div id="hud"></div>
    <div id="result" hidden>
      <div><pre id="result-text"></pre><button onclick="location.reload()">Run again</button></div>
    </div>
    <script type="module" src="/src/perf.ts"></script>
  </body>
</html>
